name: Deploy Hostinger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist to production branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: production
          clean: true
          commit-message: "Deploy: ${{ github.sha }}"
